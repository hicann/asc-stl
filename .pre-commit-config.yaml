repos:
  - repo: local
    hooks:
      - id: add-license-header
        name: Add Apache-2.0 license header
        entry: python scripts/add_license_header.py
        language: system
        files: \.(asc|cpp|cc|cxx|h|hpp|cuh|py|sh|cmake|cmake\.in|cpp\.in)$|(^|/)CMakeLists\.txt$|(^|/)__config$
        # Preserve the upstream CANN license on the GitCode-provided CI script.
        exclude: ^\.gitcode/scripts/ut\.sh$
        stages: [pre-commit]

      - id: asc-stl-style-check
        name: asc-stl code style check
        entry: bash scripts/check-style.sh
        language: python
        additional_dependencies:
          - clang-format==18.1.8
          - cpplint==2.0.2
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: asc-stl-python-logging
        name: ASC-STL Python logging check
        entry: python scripts/check_python_logging.py
        language: system
        files: \.py$
        stages: [pre-commit]

      - id: asc-stl-python-codecheck
        name: ASC-STL Python CodeCheck mirror
        entry: python scripts/check_python_codecheck.py
        language: system
        files: \.py$
        stages: [pre-commit]
